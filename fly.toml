app = "mazon-com"
primary_region = "iad"

[env]
  PORT = "8765"
  PSTORE_DB = "/data/pstore.db"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.checks]
    [http_service.checks.healthcheck]
      interval = "30s"
      timeout = "5s"
      grace_period = "10s"
      method = "GET"
      path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[mounts]
  source = "pstore_data"
  destination = "/data"