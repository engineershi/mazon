name: nightly-remine

# Re-mines the seeded niches from a US-egress host (GitHub's runner), which
# yields clean USD product data, commits fresh prices/products into the baked
# sqlite DB, then pings index engines so the new URLs get crawled fast.
#
# Optional secrets (add in repo Settings > Secrets) to enable auto-deploy:
#   RENDER_API_KEY          (Render dashboard -> Account -> API keys)
#   RENDER_SERVICE_ID       (e.g. srv-da99ijtg1s2s739mqgj0)
#   MAZON_URL               (defaults to https://mazon.onrender.com)
#   MAZON_TAG / INDEXNOW_KEY (overrides; the committed defaults work too)

on:
  schedule:
    - cron: "23 4 * * *"   # 04:23 UTC daily
  workflow_dispatch: {}    # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: remine
  cancel-in-progress: false

jobs:
  remine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-mine seeds and rebuild DB
        env:
          MAZON_MARKET: com
          MAZON_TAG: ${{ secrets.MAZON_TAG }}
          MAZON_TOP: "6"
        run: python app/scripts/remine.py app/seeds.txt app/mazon.db 4

      - name: Commit and push fresh data (if changed)
        run: |
          git config user.name "mazon-bot"
          git config user.email "mazon-bot@users.noreply.github.com"
          git add app/mazon.db
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore(deps): nightly re-mine of seeded niches"
          git push

      - name: Trigger Render deploy (only when secrets are configured)
        if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != '' }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"

      - name: Ping IndexNow for fresh URLs
        env:
          MAZON_URL: ${{ secrets.MAZON_URL || 'https://mazon.onrender.com' }}
        run: python app/scripts/ping_indexnow.py